services:
  postgres:
    image: postgres:16-alpine
    container_name: quill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quill_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-"mL#hix.p(gL6Zi_<Ey,g]R|4"}
      POSTGRES_DB: ${POSTGRES_DB:-quill_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-quill_user} -d ${POSTGRES_DB:-quill_db}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
